[project]
name = "notes"
version = "0.1.0"
description = "Notepad REST API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notes"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
